  <style>
    :root {
      --bg-cream: #FDFBF7;
      --card-bg: rgba(255, 255, 255, 0.92);

      --border-light: #EBE5DF;
      --shadow-soft: 0 10px 30px rgba(60, 54, 51, 0.05);
      --shadow-hover: 0 15px 35px rgba(60, 54, 51, 0.08);
      --radius-lg: 18px;
      --radius-sm: 10px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-cream);
      color: var(--text-main);
      line-height: 1.6;
      background-image:

        radial-gradient(circle at 90% 80%, rgba(249, 239, 239, 0.6) 0%, transparent 40%);
      background-attachment: fixed;
      padding: 30px 16px 60px;
    }

    .container {
      max-width: 680px;
      margin: 0 auto;
    }

    .header {
      text-align: center;
      margin-bottom: 36px;
      padding: 20px 0;
    }

    .subtitle-script {
      font-family: 'Alex Brush', cursive;
      font-size: 2.4rem;
      color: var(--gold-accent);
      margin-bottom: -10px;
      display: block;
    }

    .main-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2.5rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: var(--text-main);
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    .wedding-details {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.15rem;
      font-style: italic;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    .dot {
      display: inline-block;
      width: 4px;
      height: 4px;
      background-color: var(--gold-accent);
      border-radius: 50%;
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-lg);
      padding: 30px;
      box-shadow: var(--shadow-soft);
      margin-bottom: 32px;
    }

    .card-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.6rem;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

      margin-bottom: 18px;
