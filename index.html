<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hui Wen & Zun Siong Wedding Guestbook</title>
  <style>
    :root {
      --bg-color: #fcfbfa;
      --card-bg: #ffffff;
      --accent: #8a735c;
      --accent-hover: #6e5a46;
      --text-main: #2c2c2c;
      --text-muted: #666666;
      --border: #e8e3dd;
      --success: #4a7c59;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; padding: 24px 16px; }
    .container { background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); max-width: 500px; width: 100%; padding: 32px 24px; text-align: center; }
    .header h1 { font-family: Georgia, serif; font-size: 26px; font-weight: normal; color: var(--accent); margin-bottom: 6px; }
    .header p { font-size: 14px; color: var(--text-muted); margin-bottom: 24px; }
    .form-group { text-align: left; margin-bottom: 18px; }
    .form-group label { display: block; font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); margin-bottom: 6px; }
    .form-group input[type="text"], .form-group textarea { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 15px; background: #fafaf9; }
    .file-dropzone { border: 2px dashed var(--border); border-radius: 8px; padding: 20px; text-align: center; background: #fafaf9; cursor: pointer; position: relative; }
    .file-dropzone input[type="file"] { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
    .file-name-preview { margin-top: 8px; font-size: 13px; color: var(--accent); font-weight: 600; word-break: break-all; }
    button.btn-submit { width: 100%; padding: 14px; background: var(--accent); color: #ffffff; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 10px; }
    button.btn-submit:hover { background: var(--accent-hover); }
    .status-msg { margin-top: 16px; font-size: 14px; display: none; }
    .status-msg.success { color: var(--success); display: block; }
    .status-msg.error { color: #d32f2f; display: block; }

    /* Guest Wishes Feed */
    .feed-section { margin-top: 32px; border-top: 1px dashed var(--border); padding-top: 24px; text-align: left; }
    .feed-title { font-family: Georgia, serif; font-size: 20px; color: var(--accent); margin-bottom: 16px; text-align: center; }
    .wish-card { background: #fafaf9; border: 1px solid var(--border); border-radius: 10px; padding: 14px; margin-bottom: 12px; }
    .wish-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .wish-author { font-weight: 600; font-size: 14px; color: var(--accent); }
    .wish-time { font-size: 11px; color: var(--text-muted); }
    .wish-text { font-size: 14px; color: var(--text-main); line-height: 1.4; white-space: pre-wrap; }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>Hui Wen & Zun Siong</h1>
      <p>Share Your Wishes & Memories | 22 Nov 2026</p>
    </div>

    <!-- Upload Form -->
    <form id="weddingForm">
      <div class="form-group">
        <label for="guestName">Your Name(s)</label>
        <input type="text" id="guestName" placeholder="e.g. Alex & Sarah" required>
      </div>

      <div class="form-group">
        <label for="guestWish">Warm Wishes / Message</label>
        <textarea id="guestWish" rows="3" placeholder="Leave a message for the couple..."></textarea>
      </div>

      <div class="form-group">
        <label>Photos / Videos (Multiple allowed)</label>
        <div class="file-dropzone">
          <p id="dropzoneText">Tap to select photos or videos</p>
          <input type="file" id="mediaFile" accept="image/*,video/*" multiple>
        </div>
        <div id="fileNamePreview" class="file-name-preview"></div>
      </div>

      <button type="submit" id="submitBtn" class="btn-submit">Send Wish</button>
      <div id="statusMsg" class="status-msg"></div>
    </form>

    <!-- Public Wishes Feed -->
    <div class="feed-section">
      <h2 class="feed-title">Guestbook Messages</h2>
      <div id="wishesFeed">Loading messages...</div>
    </div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzXT1U4B9fPFpmC-M3VmtNvAa-lpeTpEXVl03mkWPUxYN-70BY4FVXYpKK9ebdSlDGc/exec";

    const mediaFileInput = document.getElementById('mediaFile');
    const fileNamePreview = document.getElementById('fileNamePreview');
    const dropzoneText = document.getElementById('dropzoneText');
    const form = document.getElementById('weddingForm');
    const submitBtn = document.getElementById('submitBtn');
    const statusMsg = document.getElementById('statusMsg');

    window.addEventListener('DOMContentLoaded', loadWishes);

    mediaFileInput.addEventListener('change', function() {
      if (this.files && this.files.length > 0) {
        fileNamePreview.textContent = `Selected (${this.files.length} file${this.files.length > 1 ? 's' : ''}): ` + Array.from(this.files).map(f => f.name).join(', ');
        dropzoneText.textContent = "Tap to continue to selecr photos or videos";
      } else {
        fileNamePreview.textContent = "";
        dropzoneText.textContent = "Tap to select photos or videos";
      }
    });

    form.addEventListener('submit', async function(e) {
      e.preventDefault();
      submitBtn.disabled = true;
      submitBtn.textContent = "Uploading...";
      statusMsg.className = "status-msg";
      statusMsg.textContent = "";

      const name = document.getElementById('guestName').value;
      const wish = document.getElementById('guestWish').value;
      const files = mediaFileInput.files;

      let payload = { name: name, wish: wish, files: [] };

      if (files.length > 0) {
        try {
          for (let i = 0; i < files.length; i++) {
            const base64 = await readFileAsBase64(files[i]);
            payload.files.push({
              fileName: files[i].name,
              mimeType: files[i].type,
              fileData: base64
            });
          }
        } catch (err) {
          showStatus("Error reading files. Please try again.", false);
          resetBtn();
          return;
        }
      }

      try {
        await fetch(SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        showStatus("Thank you! Your wish has been posted.", true);
        form.reset();
        fileNamePreview.textContent = "";
        dropzoneText.textContent = "Tap to select photos or videos";
        setTimeout(loadWishes, 2000);
      } catch (err) {
        showStatus("Upload failed. Please try again.", false);
      } finally {
        resetBtn();
      }
    });

    async function loadWishes() {
      const feed = document.getElementById('wishesFeed');
      try {
        const res = await fetch(SCRIPT_URL);
        const data = await res.json();
        if (data && data.length > 0) {
          feed.innerHTML = data.map(item => `
            <div class="wish-card">
              <div class="wish-header">
                <span class="wish-author">${escapeHtml(item.name || 'Anonymous')}</span>
                <span class="wish-time">${escapeHtml(item.timestamp || '')}</span>
              </div>
              <div class="wish-text">${escapeHtml(item.wish || '')}</div>
            </div>
          `).join('');
        } else {
          feed.innerHTML = '<p style="text-align:center; color:#888; font-size:14px;">Be the first to leave a wish!</p>';
        }
      } catch (e) {
        feed.innerHTML = '<p style="text-align:center; color:#888; font-size:14px;">Unable to load messages.</p>';
      }
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    function readFileAsBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = error => reject(error);
        reader.readAsDataURL(file);
      });
    }

    function showStatus(msg, isSuccess) {
      statusMsg.textContent = msg;
      statusMsg.className = "status-msg " + (isSuccess ? "success" : "error");
    }

    function resetBtn() {
      submitBtn.disabled = false;
      submitBtn.textContent = "Send Wish";
    }
  </script>
</body>
</html>
