<script>
    // Your Apps Script Web App URL
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw1LRiWcimvwj4Iobidd2KlZgPltvlICgA_Xba_J94uuLTIDHWkFj-n6SXMf2ZV6IZ9lQ/exec";

    let allEntries = [];

    // Image preview handling
    const fileInput = document.getElementById('guestPhoto');
    const previewContainer = document.getElementById('previewContainer');
    const imagePreview = document.getElementById('imagePreview');
    const removeImgBtn = document.getElementById('removeImgBtn');
    const uploadLabel = document.getElementById('uploadLabel');

    fileInput.addEventListener('change', function() {
      const file = this.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          imagePreview.src = e.target.result;
          previewContainer.style.display = 'block';
          uploadLabel.innerHTML = `<span>Change selected photo</span>`;
        };
        reader.readAsDataURL(file);
      }
    });

    removeImgBtn.addEventListener('click', function() {
      fileInput.value = '';
      imagePreview.src = '';
      previewContainer.style.display = 'none';
      uploadLabel.innerHTML = `<svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg><span>Choose a photo to upload</span>`;
    });

    // Client-side image compression helper
    function compressImage(file, maxWidth = 800, quality = 0.6) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (e) => {
          const img = new Image();
          img.src = e.target.result;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let width = img.width;
            let height = img.height;

            if (width > maxWidth || height > maxWidth) {
              if (width > height) {
                height = Math.round((height * maxWidth) / width);
                width = maxWidth;
              } else {
                width = Math.round((width * maxWidth) / height);
                height = maxWidth;
              }
            }

            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);

            resolve(canvas.toDataURL('image/jpeg', quality));
          };
        };
      });
    }

    // Form submission
    document.getElementById('guestbookForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const submitBtn = document.getElementById('submitBtn');
      const statusMessage = document.getElementById('statusMessage');
      
      const name = document.getElementById('guestName').value.trim();
      const message = document.getElementById('guestMessage').value.trim();
      const photoFile = fileInput.files[0];

      submitBtn.disabled = true;
      statusMessage.style.color = "var(--text-muted)";
      statusMessage.innerText = "Submitting your message and uploading photo...";

      let photoBase64 = "";
      let photoName = "";

      if (photoFile) {
        photoName = photoFile.name;
        photoBase64 = await compressImage(photoFile, 800, 0.6);
      }

      const payload = { name, message, photoBase64, photoName };

      try {
        const response = await fetch(SCRIPT_URL, {
          method: "POST",
          headers: {
            "Content-Type": "text/plain;charset=utf-8",
          },
          body: JSON.stringify(payload)
        });
        
        const res = await response.json();

        if (res.status === "success") {
          statusMessage.style.color = "var(--sage-accent)";
          statusMessage.innerText = "Thank you! Your wish has been posted.";
          
          document.getElementById('guestbookForm').reset();
          removeImgBtn.click();
          
          setTimeout(fetchWishes, 1500);
        } else {
          statusMessage.style.color = "red";
          statusMessage.innerText = "Failed to post: " + (res.message || "Please try again.");
        }
      } catch (err) {
        statusMessage.style.color = "var(--sage-accent)";
        statusMessage.innerText = "Thank you! Your wish has been posted.";
        document.getElementById('guestbookForm').reset();
        removeImgBtn.click();
        setTimeout(fetchWishes, 2000);
      } finally {
        submitBtn.disabled = false;
      }
    });

    // Fetch entries from Google Apps Script
    async function fetchWishes() {
      const feed = document.getElementById('wishesFeed');
      try {
        const response = await fetch(SCRIPT_URL);
        const res = await response.json();
        
        if (res.status === "success" && res.data) {
          allEntries = res.data;
          renderEntries(allEntries);
        } else {
          feed.innerHTML = `<p style="text-align: center; color: var(--text-muted);">No entries yet. Be the first to leave a wish!</p>`;
        }
      } catch (err) {
        console.error(err);
        feed.innerHTML = `<p style="text-align: center; color: red;">Unable to load guest wishes right now.</p>`;
      }
    }

    function renderEntries(entries) {
      const feed = document.getElementById('wishesFeed');
      
      if (entries.length === 0) {
        feed.innerHTML = `<p style="text-align: center; color: var(--text-muted); font-size: 0.9rem;">No wishes found in this view.</p>`;
        return;
      }

      feed.innerHTML = entries.map(item => `
        <div class="wish-card">
          <div class="wish-header">
            <span class="author-name">${escapeHtml(item.name)}</span>
            <span class="wish-time">${item.timestamp ? new Date(item.timestamp).toLocaleDateString() : ''}</span>
          </div>
          <div class="wish-text">${escapeHtml(item.message)}</div>
          ${item.photoUrl ? `
            <div class="wish-photo" onclick="openLightbox('${item.photoUrl}')">
              <img src="${item.photoUrl}" alt="Guest photo" loading="lazy" />
            </div>
          ` : ''}
        </div>
      `).join('');
    }

    function filterEntries(type, btn) {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      if (type === 'photos') {
        renderEntries(allEntries.filter(e => e.photoUrl && e.photoUrl !== ""));
      } else {
        renderEntries(allEntries);
      }
    }

    function openLightbox(url) {
      document.getElementById('lightboxImg').src = url;
      document.getElementById('lightbox').style.display = 'flex';
    }

    function closeLightbox() {
      document.getElementById('lightbox').style.display = 'none';
    }

    function escapeHtml(str) {
      if (!str) return "";
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    // Load initial wishes on page launch
    fetchWishes();
  </script>
